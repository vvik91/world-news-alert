<mat-toolbar color="primary" class="app-toolbar">
  <div class="nav-brand">
    <mat-icon>notifications_active</mat-icon>
    <span>World Alerts Portal</span>
  </div>

  <nav class="nav-links">
    <!-- Call navigateToUser() instead of routerLink -->
    <button mat-button (click)="navigateToUser()">
      <mat-icon>dashboard</mat-icon> Dashboard
    </button>
    
    <!-- Call navigateToAdmin() so role updates BEFORE route transition -->
    <button mat-button (click)="navigateToAdmin()">
      <mat-icon>admin_panel_settings</mat-icon> Admin Center
    </button>
  </nav>

  <div class="role-switcher">
    <mat-chip [color]="authService.isAdmin() ? 'warn' : 'accent'" selected>
      {{ authService.userRole() }}
    </mat-chip>

    <!-- Call toggleRoleAndNavigate() -->
    <button mat-stroked-button (click)="toggleRoleAndNavigate()">
      Switch to {{ authService.isAdmin() ? 'User' : 'Admin' }}
    </button>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
